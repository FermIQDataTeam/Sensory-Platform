name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Install dependencies
        run: npx pnpm@10 install --frozen-lockfile

      - name: Verify release runtime
        run: npx pnpm@10 run check:runtime

      - name: Typecheck
        run: npx pnpm@10 run typecheck

      - name: Demo boundary gate
        run: npx pnpm@10 run test:demo-boundaries

      # Fail if src/app/lib/db/database.types.ts has drifted from the live schema
      # (e.g. a migration was applied without re-running `npm run db:types`). The
      # typed Supabase client only protects code when these types are current.
      # PRs without secrets warn and skip because fork/PR secrets may be
      # unavailable. Pushes to main fail closed if secrets are missing.
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.90.0

      - name: Apply migrations and prove tenant isolation on a disposable database
        run: npx pnpm@10 run test:rls:local

      - name: Test migration drift parser
        run: npx pnpm@10 run test:migration-drift

      - name: Check database.types.ts is in sync with the schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: golkgpeqenyqrcyawjdt
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "::error::SUPABASE_ACCESS_TOKEN is required on main to run database.types.ts drift check."
              echo "::error::Add it in repo Settings → Secrets and variables → Actions."
              exit 1
            fi
            echo "::warning::SUPABASE_ACCESS_TOKEN not set — skipping database.types.ts drift check for this non-main run."
            exit 0
          fi

          generated_types="$(mktemp)"
          trap 'rm -f "${generated_types}"' EXIT
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/types/typescript?included_schemas=public%2Cgraphql_public" \
            | jq --join-output --exit-status '.types' > "${generated_types}"

          if ! cmp --silent "${generated_types}" src/app/lib/db/database.types.ts; then
            echo "::error::database.types.ts is out of date with the live schema."
            echo "::error::Run 'npm run db:types' and commit the result."
            diff --unified src/app/lib/db/database.types.ts "${generated_types}" | head -60 || true
            exit 1
          fi
          echo "OK — database.types.ts matches the live schema."

      - name: Lint
        run: npx pnpm@10 run lint

      - name: Test with domain coverage
        run: npx pnpm@10 run test:coverage

      - name: Upload coverage report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: domain-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate migrations
        run: |
          test -n "$(find supabase/migrations -name '*.sql' -type f)"
          ! grep -RInE 'DROP (TABLE|SCHEMA).*CASCADE|TRUNCATE ' supabase/migrations

      # Guard 1 (deploy-ordering): fail if the production schema is AHEAD of
      # this branch — i.e. a migration is applied on prod but missing here. That is
      # the shape of the 2026-06-25 outage. PRs without secrets warn and skip;
      # pushes to main fail closed if secrets are missing.
      - name: Check migration drift (prod schema must not be ahead of this branch)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # The project ref is not a secret; it appears throughout the repo.
          SUPABASE_PROJECT_REF: golkgpeqenyqrcyawjdt
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "::error::SUPABASE_ACCESS_TOKEN is required on main to run migration drift check."
              echo "::error::Add it in repo Settings → Secrets and variables → Actions."
              exit 1
            fi
            echo "::warning::SUPABASE_ACCESS_TOKEN not set — skipping migration drift check for this non-main run."
            exit 0
          fi
          bash scripts/check-migration-drift.sh

      - name: Install browser
        run: npx pnpm@10 exec playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npx pnpm@10 run test:e2e
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          DEMO_ADMIN_EMAIL: ${{ secrets.DEMO_ADMIN_EMAIL }}
          DEMO_ADMIN_PASSWORD: ${{ secrets.DEMO_ADMIN_PASSWORD }}
          DEMO_PANELIST_EMAIL: ${{ secrets.DEMO_PANELIST_EMAIL }}
          DEMO_PANELIST_PASSWORD: ${{ secrets.DEMO_PANELIST_PASSWORD }}

      - name: Audit production dependencies
        run: npx pnpm@10 audit --prod --audit-level=moderate

      - name: Build
        run: npx pnpm@10 run build
